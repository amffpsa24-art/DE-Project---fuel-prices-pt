# DAILY PIPELINE: runs pipeline.py on GitHub's servers every day

name: Daily fuel prices

on:
  # GitHub often starts scheduled jobs hours late, so both runs are early enough to finish before midnight in Lisbon.
  # Minute 17 instead of 00: GitHub's runners are busiest on the hour.
  schedule:
    - cron: "17 10 * * *"   # main run
    - cron: "17 13 * * *"   # backup: does nothing if the main run already loaded today
  # Adds a "Run workflow" button in the Actions tab, for manual runs
  workflow_dispatch:

# The job only needs to read the code
permissions:
  contents: read

# One run at a time: if a delayed main run and the backup overlap, the second waits for the first
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # stop a stuck run; the retries for a DGEG outage alone can take ~12 minutes

    env:
      # Database connection, from Settings > Secrets and variables > Actions.
      # psycopg reads these environment variables automatically, exactly like the local .env
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPORT: "5432"
      PGSSLMODE: require
      # Bronze layer in Azure (etl/bronze.py). Without the secret, the raw JSON is kept in the artifact only
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      AZURE_STORAGE_CONTAINER: bronze
      # GitHub's machines run on UTC; this makes date.today() use the Portuguese date
      TZ: Europe/Lisbon

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --trigger: "Run workflow" button = manual; the 13:17 cron = backup; the 10:17 cron = schedule
      - name: Run pipeline
        run: >-
          python pipeline.py --trigger
          ${{ github.event_name == 'workflow_dispatch' && 'manual'
          || github.event.schedule == '17 13 * * *' && 'backup' || 'schedule' }}

      # The runner is wiped after the job, so keep the raw JSON as an artifact.
      # "always()" uploads it even if a later step failed, so the raw data is never lost.
      - name: Upload raw snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-snapshot-${{ github.run_id }}
          path: data/bronze/
          retention-days: 90
          if-no-files-found: warn
