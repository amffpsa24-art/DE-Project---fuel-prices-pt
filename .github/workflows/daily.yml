# DAILY PIPELINE: runs pipeline.py on GitHub's servers every day
# Created: 04/10/2026
# Updated: 11/10/2026 (earlier main run + backup run: GitHub started the 19:17 runs 3-5 hours late,
#                      some after midnight in Lisbon, so 05/10 got no snapshot)
# Updated: 31/10/2026 (job timeout 15 -> 20 min: the longer retries for a DGEG outage need the room;
#                      bronze layer: raw JSON to Azure, and into the artifact)
# Updated: 31/10/2026 (both runs 3 hours earlier: GitHub was starting the 13:17 run 4-6 hours late, the backup
#                      around 21:00 UTC, leaving ~3 hours before midnight; the snapshots still land mid-afternoon)

name: Daily fuel prices

on:
  # Scheduled runs can start hours late, so both run early enough to finish before midnight in Lisbon.
  # Minute 17 instead of 00: GitHub's runners are busiest on the hour, which delays scheduled jobs.
  schedule:
    - cron: "17 10 * * *"   # main run: 10:17 UTC (in October 2026 it really started around 15:00-16:00)
    - cron: "17 13 * * *"   # backup: does nothing if the main run already loaded today
  # Adds a "Run workflow" button in the Actions tab, for manual runs and testing
  workflow_dispatch:

# The job only needs to read the code, nothing else
permissions:
  contents: read

# One run at a time: if a delayed main run and the backup overlap, the second waits for the first
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # stop a stuck run instead of letting it hang for hours (retries alone can take ~12 min)

    env:
      # Database connection: secret values come from Settings > Secrets and variables > Actions.
      # psycopg reads these environment variables automatically, exactly like the local .env
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPORT: "5432"
      PGSSLMODE: require
      # Bronze layer in Azure (etl/bronze.py). If the secret isn't set, the raw JSON is kept in the artifact only
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      AZURE_STORAGE_CONTAINER: bronze
      # GitHub's machines run on UTC; this makes date.today() use the Portuguese date
      TZ: Europe/Lisbon

    steps:
      # 1. Download the repository's code onto the runner
      - name: Check out code
        uses: actions/checkout@v5

      # 2. Install the same Python version used locally (pip cache speeds up later runs)
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      # 3. Install the project's dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Run the ETL: extract -> transform -> load (raw CSV + Neon), recorded in pipeline_runs.
      #    --trigger: "Run workflow" button = manual; the 13:17 cron = backup; the 10:17 cron = schedule
      - name: Run pipeline
        run: >-
          python pipeline.py --trigger
          ${{ github.event_name == 'workflow_dispatch' && 'manual'
          || github.event.schedule == '17 13 * * *' && 'backup' || 'schedule' }}

      # 5. Keep the raw CSV and the bronze JSON: the runner is wiped after the job, so upload them as an artifact.
      #    "always()" uploads them even if the database load or the Azure upload failed, so the raw data isn't lost.
      - name: Upload raw snapshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raw-snapshot-${{ github.run_id }}
          path: |
            data/raw/*.csv
            data/bronze/
          retention-days: 90
          if-no-files-found: warn
