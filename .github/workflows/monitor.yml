# MONITOR: every evening, checks that the day was loaded; if not, opens a GitHub issue (email + mobile app)
#
# GitHub only emails about a run that FAILS. A day where no run happens at all sends nothing.
# This check catches both cases.

name: Monitor fuel prices

on:
  schedule:
    - cron: "47 18 * * *"   # both daily runs have had time to finish
    - cron: "47 21 * * *"   # later check: closes the issue if a late or manual run loaded the day after all
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # to open and close the alert issue (with the workflow's own token, no extra secret)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      # Same database settings as daily.yml (one SELECT on pipeline_runs)
      PGHOST: ${{ secrets.PGHOST }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGPORT: "5432"
      PGSSLMODE: require
      TZ: Europe/Lisbon
      # gh (preinstalled on the runner) uses this token and repository
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Writes day, loaded (true/false) and message as step outputs
      - name: Check the day was loaded
        id: check
        run: python monitor.py

      # One issue per missing day: a second check the same evening doesn't open another one.
      # Values go through env, never pasted into the script, so an error message can't break it.
      - name: Open an issue for a missing day
        id: issue
        if: steps.check.outputs.loaded == 'false'
        env:
          TITLE: "Fuel prices not loaded for ${{ steps.check.outputs.day }}"
          MESSAGE: ${{ steps.check.outputs.message }}
        run: |
          open_issue=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -z "$open_issue" ]; then
            gh issue create --title "$TITLE" --body "$MESSAGE"
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "Issue #$open_issue is already open"
          fi

      - name: Close the issue once the day is loaded
        if: steps.check.outputs.loaded == 'true'
        env:
          TITLE: "Fuel prices not loaded for ${{ steps.check.outputs.day }}"
        run: |
          for n in $(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Loaded after all: closed by the evening check."
          done

      # Also fail the run, so GitHub's usual failure email arrives too. Only when the issue is new:
      # a later check of the same missing day stays quiet instead of emailing again.
      - name: Fail if the day is missing
        if: steps.issue.outputs.new == 'true'
        run: exit 1
